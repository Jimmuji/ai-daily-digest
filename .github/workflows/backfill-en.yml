name: Backfill English digests

# Manual only: re-translates recent days whose English digest is missing or was cut off.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many recent days to check"
        default: "7"

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Translate missing English digests
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.deepseek.com' }}
          API_MODEL: ${{ vars.API_MODEL || 'deepseek-chat' }}
        run: cd scripts && python translate_missing.py --days "${{ inputs.days }}"

      - name: Commit and push
        run: |
          git config user.name "AI Daily Bot"
          git config user.email "bot@github.com"
          git add daily/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🌐 Backfill English digests"
            git pull --rebase
            git push
          fi

name: Missing digest watchdog

# Safety net: if a Beijing day has no digest yet, dispatch the daily workflow.
# Covers a failed cron-job.org trigger or a daily run that errored out.
#
# This used to also push an empty commit every day, to stop GitHub disabling
# scheduled workflows after 60 idle days. The digest commits every day on its
# own, so the empty commits only added noise to the history.

on:
  schedule:
    - cron: '30 20 * * *'  # UTC 20:30 = Beijing 04:30, +3-4h GitHub delay → ~08:00 Beijing
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Check if today's digest exists
        id: check
        run: |
          DATE=$(TZ=Asia/Shanghai date +"%Y-%m-%d")
          echo "date=$DATE" >> $GITHUB_OUTPUT
          if [ -f "daily/${DATE}.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Today's digest already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Today's digest is MISSING - will trigger"
          fi

      - name: Trigger daily digest if missing
        if: steps.check.outputs.exists == 'false'
        run: gh workflow run daily.yml
        env:
          GH_TOKEN: ${{ github.token }}
